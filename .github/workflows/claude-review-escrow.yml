name: Claude Review Escrow Reveal
# Experimental: reveals an escrowed (hidden) Claude review only AFTER a human submits their own review.
# Scoped to PRs labeled 'escrow-demo' so it never fires on unrelated PRs.
# Triggers on pull_request_review, so it must live on the default branch (master).
on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  reveal:
    runs-on: ubuntu-latest
    # Only when: PR is opted into the escrow demo, and the review is from a human (not the bot).
    if: >-
      ${{ contains(github.event.pull_request.labels.*.name, 'escrow-demo')
          && github.event.review.user.login != 'github-actions[bot]' }}
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Reveal escrowed Claude review
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          set -euo pipefail
          echo "Human review submitted by $REVIEWER on PR #$PR — revealing escrowed Claude review."
          ids=$(gh api graphql -f query='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){comments(last:50){nodes{id isMinimized body}}}}}' \
            -F o="$OWNER" -F n="$NAME" -F p="$PR" \
            --jq '.data.repository.pullRequest.comments.nodes[] | select(.isMinimized and (.body | contains("<!-- claude-escrow -->"))) | .id')
          if [ -z "$ids" ]; then
            echo "No escrowed (minimized) Claude review found to reveal."
            exit 0
          fi
          for id in $ids; do
            echo "Revealing comment $id"
            gh api graphql -f query='mutation($id:ID!){unminimizeComment(input:{subjectId:$id}){unminimizedComment{isMinimized}}}' -f id="$id"
          done
          echo "Reveal complete."
