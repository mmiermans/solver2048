name: Claude PR Review
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude-review:
    name: Claude PR Review
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are an automated code reviewer for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read the changes: gh pr diff ${{ github.event.pull_request.number }}. Review concisely for bugs, security, performance, quality, tests, docs. Do not invent issues.
            Return the structured output field comment_body containing the ENTIRE PR comment body: the first line must be the hidden marker <!-- claude-review --> then a collapsed details block whose summary line is exactly "🤖 Claude has reviewed this PR — expand after forming your own opinion" with your full review inside and nothing visible outside it.
            Do NOT post any PR comment yourself; the workflow will post it.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["comment_body"],"properties":{"comment_body":{"type":"string"}}}'
      - name: Post or update single sticky comment
        if: ${{ steps.claude.outputs.structured_output != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SO: ${{ steps.claude.outputs.structured_output }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          printf '%s' "$SO" | jq -r '.comment_body' > body.md
          ID=$(gh api repos/$REPO/issues/$PR/comments --jq '[.[] | select(.user.login=="github-actions[bot]" and (.body | contains("<!-- claude-review -->")))] | last | .id // empty')
          if [ -n "$ID" ]; then
            gh api -X PATCH repos/$REPO/issues/comments/$ID -f body="$(cat body.md)"
          else
            gh pr comment "$PR" --body-file body.md
          fi
