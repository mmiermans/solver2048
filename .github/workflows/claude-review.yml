name: Claude PR Review
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude-review:
    name: Claude PR Review
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are an automated code reviewer for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read the changes: gh pr diff ${{ github.event.pull_request.number }}. Review concisely for bugs, security, performance, quality, tests, docs. Do not invent issues.
            Write the review to review.md. Its FIRST line must be the exact hidden marker (an invisible HTML comment):
            <!-- claude-review -->
            followed immediately by one collapsed details block:
            <details>
            <summary>🤖 Claude has reviewed this PR — expand after forming your own opinion</summary>

            (your full review)

            </details>
            Nothing VISIBLE may appear outside the details block (the marker renders invisibly).
            STICKY DELIVERY — keep ONE comment across runs. Find any prior review comment carrying the marker:
              ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --jq '[.[] | select(.user.login=="github-actions[bot]" and (.body | contains("<!-- claude-review -->")))] | last | .id // empty')
            If ID is non-empty, UPDATE that comment:
              gh api -X PATCH repos/${{ github.repository }}/issues/comments/$ID -f body="$(cat review.md)"
            Otherwise create a new comment:
              gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
            No inline comments, no approve/request-changes, no AI attribution.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*)"
