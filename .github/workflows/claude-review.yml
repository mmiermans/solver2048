name: Claude PR Review
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude-review:
    name: Claude PR Review
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are an automated code reviewer for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read the changes: gh pr diff ${{ github.event.pull_request.number }}. Review concisely. Do not invent issues.
            Write review.md: FIRST line the hidden marker <!-- claude-review --> then one collapsed details block with summary exactly "🤖 Claude has reviewed this PR — expand after forming your own opinion", review inside, nothing visible outside.
            Post it as a new comment: gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
            No inline comments, no approve/request-changes, no AI attribution.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr comment:*)"
      - name: Minimize superseded reviews
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          mapfile -t ids < <(gh api repos/$REPO/issues/$PR/comments --jq '.[] | select(.user.login=="github-actions[bot]" and (.body | contains("<!-- claude-review -->"))) | .node_id')
          n=${#ids[@]}
          echo "marked review comments: $n"
          for ((i=0; i<n-1; i++)); do
            gh api graphql -f query='mutation($id:ID!){minimizeComment(input:{subjectId:$id,classifier:OUTDATED}){minimizedComment{isMinimized}}}' -f id="${ids[$i]}"
          done
