name: Claude PR Review
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude-review:
    name: Claude PR Review
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'no-ai-review') }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are an automated code reviewer for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. Read changes: gh pr diff ${{ github.event.pull_request.number }}. Review for bugs/improvements, be concise, and post ONE PR comment: gh pr comment ${{ github.event.pull_request.number }} --body-file <file>. No inline comments, no approve/request-changes, no AI attribution.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr comment:*)"
