name: Claude PR Review
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude-review:
    name: Claude PR Review
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are an automated code reviewer for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. Read changes with: gh pr diff ${{ github.event.pull_request.number }}
            Classify the single most severe issue as: none, minor, or major.
            Then post EXACTLY ONE PR comment (write to file, gh pr comment ${{ github.event.pull_request.number }} --body-file <file>):
            - If none/minor: the ONLY visible (non-collapsed) text must be exactly: "Claude reviewed - no blocking issues found." Then a collapsed <details><summary>Optional notes (expand if you want)</summary> ... </details> containing any minor notes. Summary must not reveal specifics.
            - If major: the entire body must be a collapsed <details><summary>Claude review available - expand after forming your own opinion</summary> ... full review ... </details> with NO visible findings outside the block.
            RULES: never reveal findings in visible text; one comment only; no approve/request-changes; no AI attribution.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr comment:*)"
