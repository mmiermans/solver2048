name: Claude PR Review
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude-review:
    name: Claude PR Review
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are an automated code reviewer for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            1. Read the changes: gh pr diff ${{ github.event.pull_request.number }}
            2. Review the diff for bugs and improvements. Be concise.
            3. Post EXACTLY ONE PR comment. Write your review to a file, then: gh pr comment ${{ github.event.pull_request.number }} --body-file <file>
               The ENTIRE comment body MUST be a single collapsed <details> block with this exact structure:

               <details>
               <summary>Claude has reviewed this PR - expand after you have formed your own opinion</summary>

               (your full review in markdown here)

               </details>

            RULES: The <summary> line MUST NOT reveal any findings, counts, severities, or verdicts. Post only ONE comment, no inline comments. Do not approve or request changes. No AI attribution / Co-authored-by.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr comment:*)"
