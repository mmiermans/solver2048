name: Claude PR Review
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  claude-review:
    name: Claude PR Review
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            You are testing an ESCROW mechanism for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}: the review is computed immediately but HIDDEN until revealed, to avoid biasing the human.
            1. Read changes: gh pr diff ${{ github.event.pull_request.number }}
            2. Post your full review as ONE PR comment (plain markdown, no <details> needed): write to file, gh pr comment ${{ github.event.pull_request.number }} --body-file <file>
            3. HIDE it by minimizing it via GraphQL (this is how a hidden-until-reveal escrow stores the review):
               - Get the comment node id of the comment you just posted: gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --jq "[.[]|select(.user.login==\"github-actions[bot]\")]|last|.node_id"
               - Minimize: gh api graphql -f query="mutation(\$id:ID!){minimizeComment(input:{subjectId:\$id,classifier:OUTDATED}){minimizedComment{isMinimized minimizedReason}}}" -f id=<node_id>
            4. Confirm it returned isMinimized=true.
            5. DEMONSTRATE THE REVEAL: call unminimizeComment on the same id: gh api graphql -f query="mutation(\$id:ID!){unminimizeComment(input:{subjectId:\$id}){unminimizedComment{isMinimized}}}" -f id=<node_id> and confirm isMinimized=false. Then minimize it again so it is left hidden.
            RULES: no approve/request-changes; no AI attribution. Note in your report whether the hidden comment content is still retrievable via the REST/GraphQL API (a "no surprises"/security caveat).
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*)"
